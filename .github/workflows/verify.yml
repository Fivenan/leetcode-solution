name: Verify solutions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [structure, go, rust, java]
    steps:
      - name: Check out solutions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Compile and check
        run: node scripts/verify-${{ matrix.check }}.mjs
      - name: Compare difficult algorithms with independent references
        if: matrix.check != 'structure'
        run: node scripts/verify-properties.mjs ${{ matrix.check }}
